name: Reality Report

# Spousti se zvenci pres /api/spustit, ne planovacem GitHubu.
#
# Planovac tady byl a mel slouzit jako zaloha, jenze bot pak bezel dvakrat
# denne: jednou nacas z externi sluzby a podruhe se zpozdenim odsud.
# U placeneho reportu to odchytila pojistka posledni_report, u bezplatneho
# ne — a 288 lidem chodil denni prehled dvakrat.
#
# Zaloha, ktera tise posila e-maily navic, je horsi nez zadna zaloha.
on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python report.py
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
      - run: python byty_praha.py
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
      - run: python cinzaky_report.py
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
      - run: python chaty.py
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
      - run: python cinzaky_kraje.py
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
