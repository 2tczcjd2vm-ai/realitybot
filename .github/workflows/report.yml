name: Reality Report

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python report.py
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          