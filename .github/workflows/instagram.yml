name: Instagram

# Tri prispevky denne: rano tip z analyzy, v poledne a vecer rubriky z rotace.
#
# Vola se KAZDOU HODINU a o tom, jestli se ma postovat, rozhoduje endpoint
# podle hodiny v Praze. Duvod: planovac GitHubu strili nepresne — 5. 10. 2026
# se opozdil o skoro sest hodin a jeden beh vynechal uplne. Pri hodinovem
# volani zpozdeny beh jen dozene okno misto toho, aby prispevek propadl,
# a odpada i rucni resení letniho casu.
#
# Vetsina behu neudela nic a skonci hlaskou "mimo cas pro prispevek".
# To je v poradku, je to levnejsi nez zmeskany prispevek.

on:
  workflow_dispatch:
    inputs:
      kdy:
        description: "cast dne (auto = podle hodiny v Praze)"
        required: true
        default: auto
        type: choice
        options: [auto, rano, poledne, vecer]
  schedule:
    # Kazdou hodinu; okno vybere endpoint podle casu v Praze.
    - cron: "0 * * * *"
    # Okna zacinaji v celou a v 18:30 — pulhodinovy beh navic, aby vecerni
    # prispevek nemusel cekat do 19:00.
    - cron: "30 * * * *"

jobs:
  prispevek:
    runs-on: ubuntu-latest
    steps:
      - name: Publikovat
        env:
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
          # Rucni spusteni si cast dne vybira samo, planovac ji necha na endpointu.
          KDY: ${{ github.event.inputs.kdy }}
        run: |
          set -euo pipefail
          # Prazdne = at si cast dne urci endpoint podle hodiny v Praze.
          KDY="${KDY:-auto}"
          echo "Část dne: $KDY"

          odpoved=$(curl -sS -X POST https://podhodnocenebyty.cz/api/instagram/publikovat \
            -H "Authorization: Bearer $BROADCAST_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"kdy\":\"$KDY\"}")
          echo "$odpoved"

          # Krok musi spadnout, kdyz Instagram prispevek odmitne — jinak by se
          # chyba schovala do zeleneho behu a nikdo by si jí nevsiml.
          case "$odpoved" in
            *'"ok":false'*) echo "::error::Publikace selhala"; exit 1 ;;
          esac
