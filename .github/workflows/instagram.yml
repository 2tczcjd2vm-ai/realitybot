name: Instagram

# Tri prispevky denne: rano tip z analyzy, v poledne a vecer rubriky z rotace.
#
# Spousti se RUCNE. Pravidelne volani obstarava cron-job.org, ktery uz pousti
# i oba boty — kazdou hodinu zavola /api/instagram/publikovat a o tom, jestli
# je zrovna okno, rozhodne endpoint podle casu v Praze.
#
# Planovac GitHubu je tu zamerne vypnuty: 5. 10. 2026 se opozdil o skoro sest
# hodin a nasledujici den zahodil pet behu po sobe. Jako zaloha by nepomohl
# a jen by pridaval volani navic.

on:
  workflow_dispatch:
    inputs:
      kdy:
        description: "cast dne (auto = podle hodiny v Praze)"
        required: true
        default: auto
        type: choice
        options: [auto, rano, poledne, vecer]

jobs:
  prispevek:
    runs-on: ubuntu-latest
    steps:
      - name: Publikovat
        env:
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
          # Rucni spusteni si cast dne vybira samo, planovac ji necha na endpointu.
          KDY: ${{ github.event.inputs.kdy }}
        run: |
          set -euo pipefail
          # Prazdne = at si cast dne urci endpoint podle hodiny v Praze.
          KDY="${KDY:-auto}"
          echo "Část dne: $KDY"

          odpoved=$(curl -sS -X POST https://podhodnocenebyty.cz/api/instagram/publikovat \
            -H "Authorization: Bearer $BROADCAST_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"kdy\":\"$KDY\"}")
          echo "$odpoved"

          # Krok musi spadnout, kdyz Instagram prispevek odmitne — jinak by se
          # chyba schovala do zeleneho behu a nikdo by si jí nevsiml.
          case "$odpoved" in
            *'"ok":false'*) echo "::error::Publikace selhala"; exit 1 ;;
          esac
